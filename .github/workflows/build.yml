name: Build Android APK
on:
  push:
    branches: [ main ]
    paths:
      - '**.gradle'
      - 'gradle/wrapper/**'
      - 'src/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ main ]
    paths:
      - '**.gradle'
      - 'gradle/wrapper/**'
      - 'src/**'

env:
  GRADLE_WRAPPER_DIR: ./gradle/wrapper
  MAVEN_ALIYUN_GOOGLE: https://maven.aliyun.com/repository/google
  MAVEN_ALIYUN_PUBLIC: https://maven.aliyun.com/repository/public
  GRADLE_VER: 8.4

jobs:
  build-android:
    name: 编译安卓APK
    runs-on: ubuntu-latest
    steps:
      - name: 检出项目源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置JDK17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Gradle依赖缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            gradle/wrapper
          key: ${{ runner.os }}-gradle-v2-${{ hashFiles('**/gradle-wrapper.properties', '**/*.gradle') }}
          restore-keys: |
            ${{ runner.os }}-gradle-v2-

      - name: 自动修复Gradle Wrapper
        run: |
          mkdir -p $GRADLE_WRAPPER_DIR
          wget -q https://mirrors.aliyun.com/gradle/gradle-${{ env.GRADLE_VER }}-bin.zip -O gradle-temp.zip
          unzip -q gradle-temp
          cp gradle-${{ env.GRADLE_VER }}/lib/gradle-wrapper.jar $GRADLE_WRAPPER_DIR/
          rm -rf gradle-${{ env.GRADLE_VER }} gradle-temp.zip
          chmod +x gradlew

      - name: 配置国内Maven镜像
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle <<'EOF'
          allprojects {
            repositories {
              maven { url "${{ env.MAVEN_ALIYUN_GOOGLE }}" }
              maven { url "${{ env.MAVEN_ALIYUN_PUBLIC }}" }
              google()
              mavenCentral()
            }
            configurations.all {
              resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
            }
          }
          EOF

      - name: 授予执行权限
        run: chmod +x ./gradlew

      - name: 编译Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --max-workers=2 --stacktrace
        env:
          GRADLE_OPTS: "-Xmx2048m -XX:MaxMetaspaceSize=512m"

      - name: 上传编译成品APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-Debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: 清理无用缓存文件
        if: always()
        run: |
          rm -rf app/build
          rm -rf ~/.gradle/caches/modules-2/files-2.1
