name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Fix gradle init script conflict
        run: |
          mkdir -p ~/.gradle
          echo "allprojects {" > ~/.gradle/init.gradle
          echo "    buildscript {" >> ~/.gradle/init.gradle
          echo "        repositories {" >> ~/.gradle/init.gradle
          echo "            maven { url 'https://maven.aliyun.com/repository/public' }" >> ~/.gradle/init.gradle
          echo "            google()" >> ~/.gradle/init.gradle
          echo "            mavenCentral()" >> ~/.gradle/init.gradle
          echo "        }" >> ~/.gradle/init.gradle
          echo "    }" >> ~/.gradle/init.gradle
          echo "}" >> ~/.gradle/init.gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
