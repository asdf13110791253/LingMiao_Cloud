name: Build Android Debug APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download official gradle-wrapper.jar
        run: |
          mkdir -p gradle/wrapper
          # 下载Gradle官方8.4版本配套的wrapper jar
          wget https://github.com/gradle/gradle/raw/v8.4/gradle/wrapper/gradle-wrapper.jar -O gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew

      - name: Config gradle mirror
        run: |
          echo "allprojects { repositories { maven { url 'https://maven.aliyun.com/repository/public' } google() mavenCentral() } }" > ~/.gradle/init.gradle

      - name: Build debug apk
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
