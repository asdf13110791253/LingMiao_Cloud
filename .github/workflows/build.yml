name: Build Android Debug APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 安装Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.4

      # CI自动下载OpenCV4.8本地模块，规避线上找不到依赖
      - name: 下载OpenCV 4.8 Android SDK
        run: |
          wget -O opencv.zip https://github.com/opencv/opencv/releases/download/4.8.0/opencv-4.8.0-android-sdk.zip
          unzip -q opencv.zip
          mv opencv-4.8.0-android-sdk/sdk/java ./opencv
          echo "include ':opencv'" >> settings.gradle

      # 全局镜像兜底
      - name: 配置全局仓库
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle <<'EOF'
          allprojects {
            repositories {
              maven { url 'https://maven.aliyun.com/repository/google' }
              maven { url 'https://maven.aliyun.com/repository/public' }
              maven { url 'https://maven.aliyun.com/repository/jcenter' }
              maven { url 'https://jitpack.io' }
              google()
              mavenCentral()
            }
          }
          EOF

      - name: 编译APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: 上传APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
