name: Build Android APK
on:
  push:
    branches: [ main ]
    paths:
      - '**.gradle'
      - 'gradle/wrapper/**'
      - 'src/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ main ]
    paths:
      - '**.gradle'
      - 'gradle/wrapper/**'
      - 'src/**'

env:
  MAVEN_ALIYUN_GOOGLE: https://maven.aliyun.com/repository/google
  MAVEN_ALIYUN_PUBLIC: https://maven.aliyun.com/repository/public
  GRADLE_VER: 8.4

jobs:
  build-android:
    name: 编译安卓APK
    runs-on: ubuntu-latest
    steps:
      - name: 检出项目源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 官方Gradle Action，自动补齐wrapper，不需要wget下载文件
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VER }}

      - name: 配置国内Maven镜像
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle <<'EOF'
          allprojects {
            repositories {
              maven { url "${{ env.MAVEN_ALIYUN_GOOGLE }}" }
              maven { url "${{ env.MAVEN_ALIYUN_PUBLIC }}" }
              google()
              mavenCentral()
            }
            configurations.all {
              resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
            }
          }
          EOF

      - name: 授予执行权限
        run: chmod +x ./gradlew

      - name: 编译Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --max-workers=2 --stacktrace
        env:
          GRADLE_OPTS: "-Xmx2048m -XX:MaxMetaspaceSize=512m"

      - name: 上传编译成品APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-Debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: 清理无用缓存文件
        if: always()
        run: |
          rm -rf app/build
